<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela do Brasileirão</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 95%;
            max-width: 1000px;
            overflow-x: auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        td.posicao {
            font-weight: bold;
        }
        td.time {
            text-align: left;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tabela do Campeonato Brasileiro Série A 2025</h1>
        <table id="tabela-brasileirao">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Time</th>
                    <th>P</th>
                    <th>J</th>
                    <th>V</th>
                    <th>E</th>
                    <th>D</th>
                    <th>GP</th>
                    <th>GC</th>
                    <th>SG</th>
                    <th>%</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan="11" style="text-align: center;">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_KEY = '870a9e147b0e4fedb12fa63bb4cc028c';

        async function fetchStandings() {
            const leagueId = 71;
            const season = 2024;

            const url = `https://v3.football.api-sports.io/standings?league=${leagueId}&season=${season}`;
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY,
                    },
                });

                if (!response.ok) {
                    throw new Error(`Erro na API: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                
                if (!data.response || data.response.length === 0) {
                    throw new Error('Nenhum dado de classificação encontrado.');
                }
                
                const standings = data.response[0].league.standings[0];
                populateTable(standings);

            } catch (error) {
                console.error("Erro ao buscar a tabela:", error);
                const tbody = document.querySelector('#tabela-brasileirao tbody');
                tbody.innerHTML = `<tr><td colspan="11" style="color:red;">Erro ao carregar a tabela. Verifique sua chave de API ou tente novamente.</td></tr>`;
            }
        }

        function populateTable(standings) {
            const tbody = document.querySelector('#tabela-brasileirao tbody');
            tbody.innerHTML = '';

            standings.forEach(team => {
                const row = document.createElement('tr');
                const percentual = team.all.played > 0 ? ((team.points / (team.all.played * 3)) * 100).toFixed(0) : 0;
                
                row.innerHTML = `
                    <td class="posicao">${team.rank}</td>
                    <td class="time">${team.team.name}</td>
                    <td>${team.points}</td>
                    <td>${team.all.played}</td>
                    <td>${team.all.win}</td>
                    <td>${team.all.draw}</td>
                    <td>${team.all.lose}</td>
                    <td>${team.all.goals.for}</td>
                    <td>${team.all.goals.against}</td>
                    <td>${team.goalsDiff}</td>
                    <td>${percentual}</td>
                `;
                tbody.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', fetchStandings);
    </script>
</body>
</html>
